
<!DOCTYPE html>
<html>

<head>
    <title>Register - Secure Access System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Create an Account</h1>

        <p>Register to access the secure system.</p>

        {% if message %}
            <p style="color: #176b9a; font-weight: bold;">
                {{ message }}
            </p>
        {% endif %}

        <form method="POST">

            <input type="text"
                   name="username"
                   placeholder="Choose a username"
                   required>

            <br><br>

            <input type="email"
                   name="email"
                   placeholder="Enter your email"
                   required>

            <br><br>

            <input type="password"
                   name="password"
                   placeholder="Create a password"
                   minlength="8"
                   required>

            <br><br>

            <button type="submit">Register</button>

        </form>

        <p>Already have an account?</p>

        <a href="{{ url_for('login') }}">Log in</a>

        <br><br>

        <a href="{{ url_for('home') }}">Back to Home</a>

    </div>

</body>
</html>
